# ============================================================
# Readest / 莲花书院 - Nginx 反向代理配置模板
# ============================================================
#
# 使用方法：
#   1. 全局替换 your-domain.com 为你的实际域名
#   2. 复制到 /etc/nginx/sites-available/readest
#   3. sudo ln -sf /etc/nginx/sites-available/readest /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# 前置条件：
#   - 已安装 certbot 并申请好证书
#   - 各服务已启动且监听对应端口
# ============================================================

# 上游服务
upstream frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream backend_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream supabase_kong {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream minio_s3 {
    server 127.0.0.1:9000;
    keepalive 32;
}

upstream minio_console {
    server 127.0.0.1:9001;
    keepalive 32;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 主站 HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # ---------- SSL ----------
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------- 安全头 ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ---------- 通用设置 ----------
    client_max_body_size 100m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ============================
    # Express 后端 /api/*
    # ============================
    location /api/ {
        proxy_pass http://backend_api;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ============================
    # Supabase API /supabase/*
    # ============================
    location /supabase/ {
        rewrite ^/supabase/(.*) /$1 break;
        proxy_pass http://supabase_kong;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }

    # ============================
    # MinIO S3 API /s3/*
    # （可选，不需要公网访问时删除此块）
    # ============================
    location /s3/ {
        rewrite ^/s3/(.*) /$1 break;
        proxy_pass http://minio_s3;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        client_max_body_size  500m;
    }

    # ============================
    # MinIO 控制台 /minio/*
    # （生产环境建议限制 IP 或关闭）
    # ============================
    location /minio/ {
        rewrite ^/minio/(.*) /$1 break;
        proxy_pass http://minio_console;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 取消注释以限制访问 IP
        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny all;
    }

    # ============================
    # Next.js 前端（兜底）
    # ============================
    location / {
        proxy_pass http://frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js 构建产物（长期缓存）
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
